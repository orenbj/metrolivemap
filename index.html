<!DOCTYPE html>
<html lang="en">

<head>
    <!--
        CSP: meta tag used because GitHub Pages cannot set HTTP headers.
        'unsafe-inline' is required for inline GA/GTM blocks.

        S-1: GTM and Google/Typekit fonts load dynamic content — SRI cannot be applied.
        Mitigated by whitelisting exact hostnames in script-src / style-src.

        S-3 (Trusted Types — optional hardening, not yet enabled):
        To enforce Trusted Types, add to CSP:
          require-trusted-types-for 'script'
        and define a policy in main.js:
          const policy = trustedTypes.createPolicy('default', { createHTML: s => s });
        then replace all .innerHTML / .setHTML calls with policy.createHTML(...).
        Blocked by GTM inline scripts which don't yet support Trusted Types.
    -->
    <!-- Google Translate hosts (translate.google.com, translate.googleapis.com,
         www.gstatic.com) are whitelisted across script/style/img/font/frame/
         connect to support the lazy-loaded widget driven by js/translate.js. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://unpkg.com https://translate.google.com https://translate.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://use.typekit.net https://p.typekit.net https://fonts.googleapis.com https://www.gstatic.com https://translate.googleapis.com; img-src 'self' data: blob: https://lacmta.github.io https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://tiles.arcgis.com https://server.arcgisonline.com https://fonts.googleapis.com https://fonts.gstatic.com https://use.typekit.net https://p.typekit.net https://www.googletagmanager.com https://www.google-analytics.com https://www.gstatic.com https://translate.googleapis.com https://translate.google.com; font-src https://fonts.gstatic.com https://use.typekit.net https://p.typekit.net https://www.gstatic.com; connect-src 'self' blob: wss://api.metro.net https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://lacmta.github.io https://tiles.arcgis.com https://*.google-analytics.com https://unpkg.com https://gbfs.bcycle.com https://5cgdcfl7csnoiymgfhjp5bqgii0yxifx.lambda-url.us-west-1.on.aws https://lbwlhl4z4pktjvxw3tm6emxfui0kwjiv.lambda-url.us-west-1.on.aws https://translate.googleapis.com; frame-src https://www.googletagmanager.com https://translate.google.com https://translate.googleapis.com; worker-src blob:; object-src 'none'; base-uri 'self'; manifest-src 'self';">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://use.typekit.net" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BK2E8DN75J"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-BK2E8DN75J');

    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-M9GDT89R');</script>
    <!-- End Google Tag Manager -->

    <title>Metro Live Map</title>
    <link rel="icon" href="images/metro_logo_only_black.png" type="image/png">
    <link rel="apple-touch-icon" href="images/metro_logo_only_black.png">

    <meta property="og:title" content="Metro Live Map" />
    <meta property="og:description" content="Live map of Los Angeles Metro busways and trains." />
    <meta property="og:url" content="https://metrolivemap.net/" />
    <meta property="og:image" content="https://metrolivemap.net/images/metro_logo_only_black.png" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Real-time map of Los Angeles Metro rail lines and G/J Line BRT. See live train and bus positions updated every few seconds.">

    <!-- PWA / mobile chrome -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Metro Live">
    <meta name="format-detection" content="telephone=no">

    <!-- Typekit: dynamic CSS, SRI not possible -->
    <link rel="stylesheet" href="https://use.typekit.net/goe1fni.css">

    <!-- MapLibre GL JS 5.24.0 — pinned; update version + hashes together -->
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css'
          integrity='sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK'
          crossorigin='anonymous'>
    <script defer src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'
            integrity='sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp'
            crossorigin='anonymous'></script>

    <script defer src="https://unpkg.com/mapbox-gl-esri-sources@0.0.7/dist/mapbox-gl-esri-sources.js"
            integrity="sha384-tJw5wW3YTDcHXSPV2y1r/3ptpdVt0dkzmY+/7x71MTpD3XAb0AiO+QtJhHeaRyYR"
            crossorigin="anonymous"></script>

    <!-- Google Fonts: dynamic CSS, SRI not possible -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="preload" href="https://fonts.gstatic.com/s/opensans/v40/memSYaGs126MiZpBA-UvWbX2vVnXBbObj2OVZyOOSr4dVJWUgsjZ0B11.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="styles/index-style.css">

</head>

<body>
    <a href="#map" class="skip-nav">Skip to map</a>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M9GDT89R" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <h1 class="visually-hidden">Metro Live Map</h1>

    <div id="loading" role="status" aria-live="polite" aria-label="Loading map data">
        <div class="loader-content">
            <div class="loader-ring">
                <img src="images/metro_logo_only_black.png" alt="Metro Logo" class="loader-logo">
            </div>
        </div>
    </div>

    <div id="map" role="region" aria-label="Interactive Metro map"></div>

    <!-- Search bar — fixed top-center, always visible on all devices -->
    <div id="search-bar-wrap">
        <div id="station-search-wrap">
            <input type="text" id="station-search" placeholder="Search stations..."
                   aria-label="Search stations">
            <button id="search-clear-btn" aria-label="Clear search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div id="search-results" class="hidden"></div>
        </div>
    </div>

    <div id="legend-positioner">
        <button id="legend-mini" aria-label="Open legend">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <span style="font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">Legend</span>
        </button>
        <div id="legend-container">
            <div id="sheet-handle">
                <div id="sheet-handle-pill"></div>
                <button id="sheet-close-btn" aria-label="Close legend">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="legend">
                <div id="legend-header">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <img src="images/metro_logo_only_black.png" alt="Metro Logo" width="32">
                        <div id="legend-title">
                            <div>Metro Live Map</div>
                            <div class="beta">Beta</div>
                        </div>
                    </div>
                    <button id="legend-close-btn" aria-label="Close legend" class="legend-close-btn">
                        <svg width="14" height="14" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M3.35354 2.6465C3.25924 2.55542 3.13294 2.50502 3.00184 2.50616C2.87074 2.5073 2.74534 2.55989 2.65263 2.65259C2.55993 2.74529 2.50734 2.8707 2.5062 3.0018C2.50506 3.1329 2.55546 3.2592 2.64654 3.3535L5.29304 6L2.64654 8.6465C2.59879 8.69262 2.56069 8.7478 2.53449 8.8088C2.50829 8.8698 2.49449 8.93541 2.49392 9.0018C2.49334 9.06819 2.50599 9.13403 2.53113 9.19548C2.55627 9.25693 2.5934 9.31275 2.64034 9.3597C2.68729 9.40664 2.74312 9.44377 2.80456 9.46891C2.86601 9.49405 2.93185 9.5067 2.99824 9.50613C3.06463 9.50555 3.13024 9.49176 3.19124 9.46555C3.25224 9.43935 3.30742 9.40126 3.35354 9.3535L6.00004 6.707L8.64654 9.3535C8.74084 9.44458 8.86714 9.49498 8.99824 9.49384C9.12934 9.4927 9.25475 9.44011 9.34745 9.34741C9.44015 9.25471 9.49274 9.1293 9.49388 8.9982C9.49502 8.8671 9.44462 8.7408 9.35354 8.6465L6.70704 6L9.35354 3.3535C9.44462 3.2592 9.49502 3.1329 9.49388 3.0018C9.49274 2.8707 9.44015 2.74529 9.34745 2.65259C9.25475 2.55989 9.12934 2.5073 8.99824 2.50616C8.86714 2.50502 8.74084 2.55542 8.64654 2.6465L6.00004 5.293L3.35354 2.6465Z"
                                fill="currentColor" fill-opacity="0.85" />
                        </svg>
                    </button>
                </div>

                <div style="padding: 0 4px;">
                    <div id="legend-total-row"
                        style="display: flex; justify-content: flex-start; align-items: center; gap: 10px; font-weight: bold; margin: 4px 0 8px 0; font-size: 14px; color: var(--text-heading);">
                        <span>Total Active Vehicles</span>
                        <span id="total-count-badge" class="metric-badge" style="background-color: var(--text-heading); color: var(--bg-glass-solid);" aria-live="polite">0</span>
                    </div>

                    <div id="legend-toggle-hint" style="font-size: 11px; margin-bottom: 4px; user-select: none; padding-right: 24px;">
                        <span style="color: var(--text-muted); font-style: italic;">Click a row to toggle</span>
                    </div>
                    <div id="legend-filter-actions">
                        <button id="show-all-btn" class="legend-action-btn" style="display: none;">Show All</button>
                        <button id="hide-all-btn" class="legend-action-btn">Hide All</button>
                    </div>
                </div>

                <div id="legend-icons">
                    <div class="legend-row" data-route="801">
                        <img src="https://lacmta.github.io/metro-iconography/Service_ALine.svg" alt="A Line icon" loading="lazy" decoding="async">
                        <div class="bar-track"><div class="bar-fill" style="background:#0072bc"></div></div>
                        <span class="count-badge">0</span>
                    </div>
                    <div class="legend-row" data-route="802">
                        <img src="https://lacmta.github.io/metro-iconography/Service_BLine.svg" alt="B Line icon" loading="lazy" decoding="async">
                        <div class="bar-track"><div class="bar-fill" style="background:#e31937"></div></div>
                        <span class="count-badge">0</span>
                    </div>
                    <div class="legend-row" data-route="803">
                        <img src="https://lacmta.github.io/metro-iconography/Service_CLine.svg" alt="C Line icon" loading="lazy" decoding="async">
                        <div class="bar-track"><div class="bar-fill" style="background:#58a738"></div></div>
                        <span class="count-badge">0</span>
                    </div>
                    <div class="legend-row" data-route="804">
                        <img src="https://lacmta.github.io/metro-iconography/Service_ELine2.svg" alt="E Line icon" loading="lazy" decoding="async">
                        <div class="bar-track"><div class="bar-fill" style="background:#fdb913"></div></div>
                        <span class="count-badge">0</span>
                    </div>
                    <div class="legend-row" data-route="805">
                        <img src="https://lacmta.github.io/metro-iconography/Service_DLine.svg" alt="D Line icon" loading="lazy" decoding="async">
                        <div class="bar-track"><div class="bar-fill" style="background:#a05da5"></div></div>
                        <span class="count-badge">0</span>
                    </div>
                    <div class="legend-row" data-route="807">
                        <img src="https://lacmta.github.io/metro-iconography/Service_KLine.svg" alt="K Line icon" loading="lazy" decoding="async">
                        <div class="bar-track"><div class="bar-fill" style="background:#e56db1"></div></div>
                        <span class="count-badge">0</span>
                    </div>
                    <div class="legend-row" data-route="901">
                        <img src="https://lacmta.github.io/metro-iconography/Service_GLine.svg" alt="G Line icon" loading="lazy" decoding="async">
                        <div class="bar-track"><div class="bar-fill" style="background:#fc4c02"></div></div>
                        <span class="count-badge">0</span>
                    </div>
                    <div class="legend-row" data-route="910">
                        <img src="https://lacmta.github.io/metro-iconography/Service_JLine.svg" alt="J Line icon" loading="lazy" decoding="async">
                        <div class="bar-track"><div class="bar-fill" style="background:#adb8bf"></div></div>
                        <span class="count-badge">0</span>
                    </div>
                </div>

                <!-- Hidden toggle anchors for MBS/MM — toggled via map buttons, not menu -->
                <div id="bikeshare-legend-row" style="display:none;" data-persistent="true"></div>
                <div id="microzones-legend-row" style="display:none;" data-persistent="true"></div>

                <div id="update-time-container" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--text-muted); margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border-line);">
                    <div id="mobile-total-row" style="display:none; align-items:center; gap:6px; font-weight:700; font-size:12px; color:var(--text-heading);">
                        <span>Total</span>
                        <span id="total-count-badge-mobile" class="metric-badge" style="background-color:var(--text-heading);color:var(--bg-glass-solid);" aria-live="polite">0</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <div id="connection-status-dot" title="Connecting"></div>
                        <div id="update-time" aria-live="polite">Connecting...</div>
                    </div>
                </div>


            </div>
        </div>
    </div>
    <!-- Hidden container Google Translate Element targets. The widget injects
         a <select.goog-te-combo> + iframe banner here; CSS in index-style.css
         suppresses every visual the widget tries to render so only our custom
         language picker (js/translate.js) is user-visible. -->
    <div id="google_translate_element" aria-hidden="true"></div>

    <!-- stops.js replaced by async fetch in main.js — see js/stops.json -->
    <script type="module" src="js/main.js"></script>
</body>


</html>
