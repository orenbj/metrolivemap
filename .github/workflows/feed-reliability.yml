name: feed-reliability

# Runs scripts/audit-feeds.js against the live Metro GTFS-RT WebSocket feeds
# and uploads the JSON report as a 30-day artifact. The same stdout that
# prints the per-field coverage tables is teed into $GITHUB_STEP_SUMMARY so
# reviewers can see top-line presence percentages in the run page without
# downloading the artifact.
#
# Purpose: keep an empirical baseline of which optional GTFS-RT fields Metro
# actually populates (occupancyStatus, arrival.uncertainty, tripUpdate.delay,
# scheduleRelationship, etc.) so future accuracy work can be grounded in
# data, not the proto spec.
#
# Cadence (2026-05-26): two captures per week at different times of day,
# chosen so they don't collide with live-accuracy.yml's slots.
#   - Wed 17:00 UTC = 10:00 PDT / 09:00 PST  → weekday mid-day
#   - Fri 23:00 UTC = 16:00 PDT / 15:00 PST  → weekday PM peak
#
# 20-minute capture per run. At ~1 frame/sec/feed × 4 feeds that's ~4,800
# frame observations; vehicle_positions cadence + tripUpdate stopTimeUpdate
# lists give >10k field-level observations per run — enough to characterise
# coverage tiers (≥30% / 5–30% / <5%) per field.

on:
  # Crons active — the repo is public, so GitHub Actions minutes are
  # unlimited and the earlier private-repo budget cap no longer applies.
  # Two captures per week (see header) at slots that don't collide with
  # live-accuracy.yml; manual workflow_dispatch remains available.
  #
  # Note: issue #235 was waiting on threshold-tuning data from the first
  # post-re-enable run.
  schedule:
    - cron: '0 17 * * 3'   # Wed 17:00 UTC — weekday mid-day
    - cron: '0 23 * * 5'   # Fri 23:00 UTC — weekday PM peak
  workflow_dispatch:
    inputs:
      duration:
        description: 'Audit duration (e.g. 30m, 15m, 5m)'
        required: false
        default: '20m'
      tag:
        description: 'Optional artifact tag (defaults to schedule slot or ISO timestamp)'
        required: false
        default: ''

concurrency:
  group: feed-reliability-${{ github.event.schedule || github.event.inputs.tag || 'manual' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write     # threshold-failure path: file an issue when audit-feeds.js exits non-zero
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Determine run tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 17 * * 3" ]; then
            echo "tag=weekday-midday-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 23 * * 5" ]; then
            echo "tag=weekday-pm-peak-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run feed audit
        id: audit
        env:
          DURATION: ${{ github.event.inputs.duration || '20m' }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p artifacts
          node scripts/audit-feeds.js \
            --duration="$DURATION" \
            --out="artifacts/audit-feeds-${TAG}.json" \
            | tee "artifacts/audit-feeds-${TAG}.summary.txt"

      - name: Surface summary in run page
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## Feed reliability — ${TAG}"
            echo '```'
            tail -n 200 "artifacts/audit-feeds-${TAG}.summary.txt" 2>/dev/null || echo "(no summary captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-reliability-${{ steps.tag.outputs.tag }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn

      # Threshold-failure path: audit-feeds.js exits 1 when any threshold check
      # FAILs (e.g. static-trip-coverage < 70%, drop rate above bound, feed
      # message-rate floor, freshness p95 ceiling). Without this fallback, a
      # silent FAIL is buried in the run page and the artifact — both of which
      # nobody reads unless something else has prompted them. File a dedup'd
      # issue so the FAIL surfaces in the issue tracker, the same way
      # rebuild-gtfs.yml does for blocked PR creation.
      - name: File issue if any threshold failed
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const tag    = ${{ toJSON(steps.tag.outputs.tag) }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title  = `⚠️ feed-reliability audit FAILED (${tag})`;
            const body   = [
              '## Feed reliability — threshold failure',
              '',
              `Run: ${runUrl}`,
              `Tag: \`${tag}\``,
              '',
              '`scripts/audit-feeds.js` exited non-zero, meaning at least one',
              'threshold check failed. Open the run page and scroll to the',
              '**Threshold evaluation** block at the bottom of the step summary',
              'to see which one(s).',
              '',
              'Common causes:',
              '- `static-trip-coverage` < 70 % → `data/trips.json` is stale; run',
              '  `node scripts/build-shapes.cjs` and commit (or check whether',
              '  the Monday `rebuild-gtfs` workflow opened a PR / filed an issue)',
              '- `feed:*:msgs/h` floor breach → upstream Metro WS outage; usually',
              '  resolves itself within the next scheduled audit',
              '- `freshness:p95` ceiling breach → feed-side cadence regression;',
              '  worth checking the per-route gap stats in the artifact JSON',
              '',
              'Close this issue once the underlying drift is fixed AND the next',
              'scheduled audit reports `✓ PASS`. The next two scheduled runs are',
              'Wed 17:00 UTC and Fri 23:00 UTC.',
            ].join('\n');

            // Dedup by label — one open issue per label window. We do NOT
            // dedupe by exact title because the tag includes the date, and
            // we want a new issue each time a FAIL recurs in a new window.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'feed-reliability-failure',
            });
            if (existing.length > 0) {
              console.log(`Open feed-reliability-failure issue already exists (#${existing[0].number}); skipping.`);
              return;
            }

            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title,
              body,
              labels: ['feed-reliability-failure'],
            });
