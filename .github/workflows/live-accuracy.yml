name: live-accuracy

# Captures real GTFS-RT vs calc vs hybrid-blend ETA accuracy via the headless
# Playwright harness (scripts/live-accuracy-headless.js). Two runs per weekday:
#   - 16:00 UTC = 08:00 PST / 09:00 PDT  → AM peak commute
#   - 21:00 UTC = 13:00 PST / 14:00 PDT  → mid-day off-peak
# 30-minute capture each. Artifacts retained 30 days; CI logs include a peek
# at byHorizon and headToHead summaries.
#
# Manual runs allowed via workflow_dispatch (configurable duration + tag).

on:
  schedule:
    - cron: '0 16 * * 1-5'   # AM peak commute (LA business days)
    - cron: '0 21 * * 1-5'   # Mid-day off-peak
  workflow_dispatch:
    inputs:
      duration:
        description: 'Capture duration (e.g. 30m, 15m, 5m)'
        required: false
        default: '30m'
      tag:
        description: 'Optional artifact tag (defaults to ISO timestamp)'
        required: false
        default: ''

concurrency:
  group: live-accuracy-${{ github.event.schedule || github.event.inputs.tag || 'manual' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Determine run tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 16 * * 1-5" ]; then
            echo "tag=peak-am-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 21 * * 1-5" ]; then
            echo "tag=offpeak-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run headless accuracy capture
        env:
          DURATION: ${{ github.event.inputs.duration || '30m' }}
        run: |
          mkdir -p artifacts
          node scripts/live-accuracy-headless.js \
            --duration="$DURATION" \
            --tag="${{ steps.tag.outputs.tag }}" \
            --out="artifacts/live-accuracy-${{ steps.tag.outputs.tag }}"

      - name: Print summary tail
        if: always()
        run: |
          set +e
          for f in artifacts/*.summary.json; do
            echo "::group::Summary: $f"
            jq '.meta, .overall, .headToHead' "$f" 2>/dev/null || cat "$f"
            echo "::endgroup::"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-accuracy-${{ steps.tag.outputs.tag }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn
