name: live-accuracy

# Captures real GTFS-RT vs calc vs hybrid-blend vs trajectory ETA accuracy via
# the headless Playwright harness (scripts/live-accuracy-headless.js).
#
# Weekday cadence (Mon–Fri):
#   - 15:00 UTC = 08:00 PDT / 07:00 PST  → AM peak commute
#   - 20:00 UTC = 13:00 PDT / 12:00 PST  → mid-day off-peak
#
# Weekend cadence (Sat–Sun) — added 2026-05-15 to accelerate the Phase 5 →
# Phase 6 starter data set. Weekend service patterns differ materially from
# weekday (lighter headways, less rush-recovery pressure), so weekend tags
# are kept distinct from weekday tags — pool only within the same group when
# computing headline accuracy stats.
#   - 15:00 UTC = 08:00 PDT  → weekend AM
#   - 18:00 UTC = 11:00 PDT  → weekend mid-morning
#   - 21:00 UTC = 14:00 PDT  → weekend afternoon
#   - 00:00 UTC = 17:00 PDT (prior day, fires on Sun/Mon UTC for Sat/Sun PDT)
#                          → weekend evening
#
# 60-minute capture each. Artifacts retained 90 days (extended from 30 to cover
# the full Phase 8 A/B validation cycle without manual archival); CI logs
# include a peek at byHorizon and headToHead summaries.
#
# Manual runs allowed via workflow_dispatch (configurable duration + tag).

on:
  schedule:
    - cron: '0 15 * * 1-5'   # weekday AM peak commute
    - cron: '0 20 * * 1-5'   # weekday mid-day off-peak
    - cron: '0 15 * * 6,0'   # weekend AM
    - cron: '0 18 * * 6,0'   # weekend mid-morning
    - cron: '0 21 * * 6,0'   # weekend afternoon
    - cron: '0 0 * * 0,1'    # weekend evening (UTC Sun/Mon = Sat/Sun PDT 17:00)
  workflow_dispatch:
    inputs:
      duration:
        description: 'Capture duration (e.g. 30m, 15m, 5m)'
        required: false
        default: '60m'
      tag:
        description: 'Optional artifact tag (defaults to ISO timestamp)'
        required: false
        default: ''

concurrency:
  group: live-accuracy-${{ github.event.schedule || github.event.inputs.tag || 'manual' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Determine run tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 1-5" ]; then
            echo "tag=peak-am-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 20 * * 1-5" ]; then
            echo "tag=offpeak-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 6,0" ]; then
            echo "tag=weekend-am-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 18 * * 6,0" ]; then
            echo "tag=weekend-mid-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 21 * * 6,0" ]; then
            echo "tag=weekend-pm-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * 0,1" ]; then
            # Fires on Sun/Mon UTC, representing Sat/Sun PDT evening (17:00 PDT).
            # Tag with yesterday's UTC date so the value matches the LA-local
            # calendar day a human would attribute the capture to.
            echo "tag=weekend-eve-$(date -u -d 'yesterday' +%Y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run headless accuracy capture
        env:
          DURATION: ${{ github.event.inputs.duration || '60m' }}
        run: |
          mkdir -p artifacts
          node scripts/live-accuracy-headless.js \
            --duration="$DURATION" \
            --tag="${{ steps.tag.outputs.tag }}" \
            --out="artifacts/live-accuracy-${{ steps.tag.outputs.tag }}"

      - name: Print summary tail
        if: always()
        run: |
          set +e
          for f in artifacts/*.summary.json; do
            echo "::group::Summary: $f"
            jq '.meta, .overall, .headToHead, .byRoute' "$f" 2>/dev/null || cat "$f"
            echo "::endgroup::"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-accuracy-${{ steps.tag.outputs.tag }}
          path: artifacts/*
          retention-days: 90
          if-no-files-found: warn
