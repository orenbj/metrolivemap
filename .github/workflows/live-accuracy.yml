name: live-accuracy

# Captures real GTFS-RT vs calc vs blend ETA accuracy via the headless
# Playwright harness (scripts/live-accuracy-headless.js).
#
# Cadence simplified 2026-05-17 (post-Phase-5b pivot): the original
# 18 captures/week were sized for the Phase 5 → Phase 8 A/B validation
# cycle, which no longer exists. The new cadence is regression monitoring
# only — four representative samples across weekday/weekend service
# profiles. Manual runs are still available via workflow_dispatch when
# a PR's blend/calc/snap change warrants a fresh capture.
#
#   - Tue 15:00 UTC = 08:00 PDT / 07:00 PST  → weekday AM peak commute
#   - Thu 20:00 UTC = 13:00 PDT / 12:00 PST  → weekday mid-day off-peak
#   - Sat 18:00 UTC = 11:00 PDT              → weekend mid-morning
#   - Sun 21:00 UTC = 14:00 PDT              → weekend afternoon
#
# 30-minute capture each (down from 60 min; still ~1500+ paired snapshots
# per run — plenty for trend tracking). Artifacts retained 30 days (down
# from 90; the Phase 8 retention rationale is gone).

on:
  # Crons active — the repo is public, so GitHub Actions minutes are
  # unlimited and the earlier private-repo budget cap no longer applies.
  # Four weekly captures across weekday/weekend profiles (see header);
  # manual workflow_dispatch remains available for ad-hoc PR captures.
  schedule:
    - cron: '0 15 * * 2'   # Tue 15:00 UTC — weekday AM peak commute
    - cron: '0 20 * * 4'   # Thu 20:00 UTC — weekday mid-day off-peak
    - cron: '0 18 * * 6'   # Sat 18:00 UTC — weekend mid-morning
    - cron: '0 21 * * 0'   # Sun 21:00 UTC — weekend afternoon
  workflow_dispatch:
    inputs:
      duration:
        description: 'Capture duration (e.g. 30m, 15m, 5m)'
        required: false
        default: '30m'
      tag:
        description: 'Optional artifact tag (defaults to ISO timestamp)'
        required: false
        default: ''

concurrency:
  group: live-accuracy-${{ github.event.schedule || github.event.inputs.tag || 'manual' }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write     # failure path: file an issue when the accuracy harness breaks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Determine run tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 15 * * 2" ]; then
            echo "tag=peak-am-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 20 * * 4" ]; then
            echo "tag=offpeak-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 18 * * 6" ]; then
            echo "tag=weekend-mid-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 21 * * 0" ]; then
            echo "tag=weekend-pm-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run headless accuracy capture
        env:
          DURATION: ${{ github.event.inputs.duration || '30m' }}
          RUN_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p artifacts
          node scripts/live-accuracy-headless.js \
            --duration="$DURATION" \
            --tag="$RUN_TAG" \
            --out="artifacts/live-accuracy-$RUN_TAG"

      - name: Print summary tail
        if: always()
        run: |
          set +e
          for f in artifacts/*.summary.json; do
            echo "::group::Summary: $f"
            jq '.meta, .overall, .headToHead, .byRoute' "$f" 2>/dev/null || cat "$f"
            echo "::endgroup::"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-accuracy-${{ steps.tag.outputs.tag }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: warn

      # Failure path: a sustained accuracy-harness breakage (npm ci, Playwright
      # install, the headless capture, or a non-zero harness exit) just turns
      # the run red on the Actions tab — which nobody watches unless something
      # else has prompted them. File a dedup'd issue so the breakage surfaces
      # in the issue tracker, mirroring feed-reliability.yml and rebuild-gtfs.yml.
      - name: File issue if the accuracy capture failed
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const tag    = ${{ toJSON(steps.tag.outputs.tag) }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title  = `⚠️ live-accuracy capture FAILED (${tag})`;
            const body   = [
              '## Live accuracy — harness failure',
              '',
              `Run: ${runUrl}`,
              `Tag: \`${tag}\``,
              '',
              'The `live-accuracy` workflow exited non-zero. The headless',
              'Playwright accuracy capture (`scripts/live-accuracy-headless.js`)',
              'or one of its setup steps (`npm ci`, `playwright install`) failed.',
              'Open the run page above to see which step is red.',
              '',
              'Common causes:',
              '- Playwright/Chromium install regression on the runner',
              '- the headless harness throwing (e.g. a page-load or feed-connect',
              '  failure) — check the failing step log for the stack trace',
              '- upstream Metro WS outage starving the capture of paired snapshots',
              '',
              'Close this issue once the underlying break is fixed AND the next',
              'scheduled (or manual `workflow_dispatch`) run goes green.',
            ].join('\n');

            // Dedup by label — one open issue per label window. We do NOT dedupe
            // by exact title because the tag includes the date, and we want a
            // fresh issue each time a breakage recurs in a new window.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'live-accuracy-failure',
            });
            if (existing.length > 0) {
              console.log(`Open live-accuracy-failure issue already exists (#${existing[0].number}); skipping.`);
              return;
            }

            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title,
              body,
              labels: ['live-accuracy-failure'],
            });

      - name: Auto-close stale live-accuracy-failure issues on recovery
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'live-accuracy-failure',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: '✅ Live-accuracy capture succeeded — harness healthy again. Auto-closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
