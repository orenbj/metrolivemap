name: Rebuild GTFS Data

# Runs weekly (Monday 09:00 UTC, one hour after the drift-check) and on
# manual trigger.  Downloads the latest Metro GTFS, re-runs build-shapes.cjs,
# and opens a PR if any of the committed data/ JSON files changed.
#
# Silent-failure protection (2026-05-26): if the create-pull-request step
# fails — most commonly because the repo-level setting "Allow GitHub Actions
# to create and approve pull requests" is disabled (Settings → Actions →
# General → Workflow permissions) — a fallback step files a GitHub issue
# instead so the rebuild requirement is visible. May 18 + May 25 both ran
# silently this way before the fallback was added, and trip coverage drifted
# to 67% (failing the feed-reliability audit threshold of 70%).
on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write     # fallback path: file an issue when PR creation is blocked

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GTFS build (auto-downloads latest Metro GTFS)
        run: node scripts/build-shapes.cjs

      - name: Check for data changes
        id: diff
        run: |
          git diff --quiet data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat data/

      - name: Open pull request with regenerated data
        id: create-pr
        if: steps.diff.outputs.changed == 'true'
        # SHA-pinned (= v6.1.0): the only THIRD-PARTY action in this repo, and it
        # runs with a token that can push branches and open PRs — a hijacked
        # floating tag here is a repo-write supply-chain hole. First-party
        # actions/* stay tag-pinned (GitHub-owned). Bump deliberately by moving
        # the SHA, not by retagging.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gtfs-rebuild-${{ github.run_id }}
          commit-message: "data: regenerate from latest Metro GTFS"
          title: "data: weekly GTFS rebuild"
          body: |
            Automated weekly rebuild of GTFS static data artifacts.

            Files updated by `node scripts/build-shapes.cjs` against the latest
            Metro GTFS feeds:
            - `data/rail-shapes.json` — per-route polylines (+ per-direction splits)
            - `data/trips.json` — trip_id → stops + scheduled times
            - `data/bus-routes.json` — bus route metadata
            - `data/bus-destinations.json` — rider-facing bus destination_code labels
            - `data/stops.json` — stop_id → { lat, lon, name } registry

            Review the diff to confirm route/trip counts look sane before merging.
            Merging auto-deploys to GitHub Pages.
          labels: gtfs-data
          delete-branch: true

      - name: Close open gtfs-drift issues on successful rebuild
        if: steps.diff.outputs.changed == 'true' && steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = '${{ steps.create-pr.outputs.pull-request-number }}';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'gtfs-drift',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `✅ Resolved by PR #${prNumber} — GTFS data rebuilt from latest Metro feed. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: File issue if PR creation was blocked
        if: failure() && steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title  = '⚠️ Weekly GTFS rebuild detected changes but could not open a PR';
            const body   = [
              '## GTFS Auto-Rebuild Failure',
              '',
              `Run: ${runUrl}`,
              '',
              'The Monday rebuild produced changes to `data/*.json` but the',
              '`peter-evans/create-pull-request@v6` step failed. Most likely cause:',
              'the repository setting **Settings → Actions → General → Workflow',
              'permissions → "Allow GitHub Actions to create and approve pull',
              'requests"** is disabled (the default for new repos).',
              '',
              'Until that setting is enabled, manual rebuild is required:',
              '',
              '```bash',
              'node scripts/build-shapes.cjs',
              'git add data/ && git commit -m "data: regenerate from latest Metro GTFS"',
              'git push origin HEAD:rebuild-gtfs-manual && gh pr create --base main',
              '```',
              '',
              'Open the linked workflow run for the exact create-pull-request error.',
              'Once the repo setting is enabled, the next successful Monday run will',
              'open a PR automatically and this issue can be closed.',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'gtfs-rebuild-failure',
            });
            if (existing.some(i => i.title === title)) {
              console.log('Issue already open — skipping duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title,
              body,
              labels: ['gtfs-rebuild-failure'],
            });
