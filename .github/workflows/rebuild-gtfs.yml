name: Rebuild GTFS Data

# Runs weekly (Monday 09:00 UTC) and on manual trigger. Downloads the latest
# Metro GTFS, re-runs build-shapes.cjs, and opens a PR if any of the committed
# data/ JSON files changed.
#
# THE SINGLE REBUILD TRIGGER (2026-08). gtfs-drift-check.yml used to ALSO
# auto-dispatch this workflow when it detected drift, but its cron ran an hour
# before this one and its 5% threshold sits far below Metro's ~45% weekly
# trip_id churn — so it fired every single week and produced two identical
# rebuild PRs (#610 + #611). That dispatch was removed; this cron is now the
# only scheduled path. The `already-open PR` guard below covers the remaining
# way to double up: a manual dispatch while last week's PR is still unmerged.
#
# Silent-failure protection (2026-05-26): if the create-pull-request step
# fails — most commonly because the repo-level setting "Allow GitHub Actions
# to create and approve pull requests" is disabled (Settings → Actions →
# General → Workflow permissions) — a fallback step files a GitHub issue
# instead so the rebuild requirement is visible. May 18 + May 25 both ran
# silently this way before the fallback was added, and trip coverage drifted
# to 67% (failing the feed-reliability audit threshold of 70%).
on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:

# A manual dispatch could race the weekly cron — cancel the superseded run
# so only the latest rebuild for this workflow is ever in flight.
concurrency:
  group: rebuild-gtfs
  cancel-in-progress: true

jobs:
  # Cheap pre-flight: if last week's rebuild PR is still sitting unmerged, a
  # second rebuild would just open a duplicate PR against the same data. Skip
  # instead — the open PR already carries regenerated data awaiting review.
  # (The workflow-level `concurrency` above only cancels runs still IN FLIGHT;
  # it cannot see a run that already finished and left a PR behind, which is
  # exactly how #610 and #611 both got opened an hour apart.)
  guard:
    runs-on: ubuntu-latest
    # write: a STALE rebuild PR is superseded (commented + closed) so a
    # forgotten review cannot freeze committed GTFS data indefinitely.
    permissions:
      pull-requests: write
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip if a rebuild PR is already open (unless it has gone stale)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # A rebuild PR awaiting review must not be disturbed — that is what
          # this guard is for. But skipping FOREVER is how data froze for 25
          # days in Aug 2026: PR #623 (Aug 10) sat unmerged, so the Aug 17 and
          # Aug 24 runs both no-opped in 7 s while reporting SUCCESS. Green
          # checkmarks, frozen data, no alert. Past this age the open PR is
          # superseded instead, capping any freeze at ~STALE_PR_DAYS + 7.
          # 10 days = a full weekly cycle plus review slack.
          STALE_PR_DAYS: '10'
        run: |
          set -euo pipefail
          # Plain command substitution + cut, not `read < <(...)`: process
          # substitution is a bashism and this must not depend on the runner's
          # default shell staying bash.
          pr_line=$(gh pr list --repo "$REPO" --state open --label gtfs-data \
                      --json number,createdAt \
                      -q '.[0] | "\(.number) \(.createdAt)"' 2>/dev/null || true)
          open_pr=$(printf '%s' "$pr_line" | cut -d' ' -f1)
          created=$(printf '%s' "$pr_line" | cut -d' ' -f2)

          if [ -z "${open_pr:-}" ]; then
            echo "No open rebuild PR — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No open rebuild PR — rebuilding." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          age_days=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))
          if [ "$age_days" -le "$STALE_PR_DAYS" ]; then
            # Normal case: a recent PR is awaiting review. Skip, but say so
            # LOUDLY in the run summary — the old failure mode was invisible
            # precisely because a skip looked identical to a real rebuild.
            echo "Rebuild PR #$open_pr is open (${age_days}d old) — skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Rebuild skipped"
              echo "PR #$open_pr is open and ${age_days} day(s) old (limit ${STALE_PR_DAYS})."
              echo "**Committed GTFS data is not being refreshed while it stays open.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Rebuild PR #$open_pr is ${age_days}d old (> ${STALE_PR_DAYS}) — superseding it."
          gh pr comment "$open_pr" --repo "$REPO" --body \
            "Superseded automatically: this rebuild PR has been open ${age_days} days (limit ${STALE_PR_DAYS}), which blocks every subsequent weekly rebuild and freezes committed GTFS data. Closing so a fresh rebuild can run — no data is lost, \`data/*.json\` is regenerated from Metro's feeds on every run." || true
          gh pr close "$open_pr" --repo "$REPO" || true
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "### ♻️ Superseded a stale rebuild PR"
            echo "Closed #$open_pr (${age_days} days old) and rebuilt with fresh data."
          } >> "$GITHUB_STEP_SUMMARY"

  rebuild:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write     # fallback path: file an issue when PR creation is blocked

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GTFS build (auto-downloads latest Metro GTFS)
        run: node scripts/build-shapes.cjs

      - name: Check for data changes
        id: diff
        run: |
          git diff --quiet data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat data/

      - name: Open pull request with regenerated data
        id: create-pr
        if: steps.diff.outputs.changed == 'true'
        # SHA-pinned (= v6.1.0): the only THIRD-PARTY action in this repo, and it
        # runs with a token that can push branches and open PRs — a hijacked
        # floating tag here is a repo-write supply-chain hole. First-party
        # actions/* stay tag-pinned (GitHub-owned). Bump deliberately by moving
        # the SHA, not by retagging.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gtfs-rebuild-${{ github.run_id }}
          commit-message: "data: regenerate from latest Metro GTFS"
          title: "data: weekly GTFS rebuild"
          body: |
            Automated weekly rebuild of GTFS static data artifacts.

            Files updated by `node scripts/build-shapes.cjs` against the latest
            Metro GTFS feeds:
            - `data/rail-shapes.json` — per-route polylines (+ per-direction splits)
            - `data/trips.json` — trip_id → stops + scheduled times
            - `data/bus-routes.json` — bus route metadata
            - `data/bus-destinations.json` — rider-facing bus destination_code labels
            - `data/stops.json` — stop_id → { lat, lon, name } registry

            Review the diff to confirm route/trip counts look sane before merging.
            Merging auto-deploys to GitHub Pages.
          labels: gtfs-data
          delete-branch: true

      - name: Close open gtfs-drift issues on successful rebuild
        if: steps.diff.outputs.changed == 'true' && steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = '${{ steps.create-pr.outputs.pull-request-number }}';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'gtfs-drift',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `✅ Resolved by PR #${prNumber} — GTFS data rebuilt from latest Metro feed. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: File issue if PR creation was blocked
        if: failure() && steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title  = '⚠️ Weekly GTFS rebuild detected changes but could not open a PR';
            const body   = [
              '## GTFS Auto-Rebuild Failure',
              '',
              `Run: ${runUrl}`,
              '',
              'The Monday rebuild produced changes to `data/*.json` but the',
              '`peter-evans/create-pull-request@v6` step failed. Most likely cause:',
              'the repository setting **Settings → Actions → General → Workflow',
              'permissions → "Allow GitHub Actions to create and approve pull',
              'requests"** is disabled (the default for new repos).',
              '',
              'Until that setting is enabled, manual rebuild is required:',
              '',
              '```bash',
              'node scripts/build-shapes.cjs',
              'git add data/ && git commit -m "data: regenerate from latest Metro GTFS"',
              'git push origin HEAD:rebuild-gtfs-manual && gh pr create --base main',
              '```',
              '',
              'Open the linked workflow run for the exact create-pull-request error.',
              'Once the repo setting is enabled, the next successful Monday run will',
              'open a PR automatically and this issue can be closed.',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'gtfs-rebuild-failure',
            });
            if (existing.some(i => i.title === title)) {
              console.log('Issue already open — skipping duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title,
              body,
              labels: ['gtfs-rebuild-failure'],
            });

      - name: File issue if the rebuild itself failed
        # Companion to the step above, covering the OTHER silent-failure class:
        # the build crashes before the diff step runs (GitLab outage, GTFS format
        # change, unzip failure, npm ci failure). Then `steps.diff` is skipped,
        # `changed` is empty, and the PR-blocked fallback above can never fire —
        # the Monday run just goes red with no issue. Gating on
        # `steps.diff.outcome != 'success'` makes the two fallbacks mutually
        # exclusive (this one skips whenever diff succeeded, i.e. the PR-blocked
        # case). Cancelled runs don't reach here — failure() is false on cancel.
        if: failure() && steps.diff.outcome != 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title  = '⚠️ Weekly GTFS rebuild failed before it could check for changes';
            const body   = [
              '## GTFS Auto-Rebuild Failure (build step)',
              '',
              `Run: ${runUrl}`,
              '',
              'The Monday rebuild job failed **before** the data-diff step ran, so it',
              'never got far enough to open a PR or file the PR-blocked issue. Likely',
              'causes: an upstream Metro GTFS outage or format change, an unzip',
              'failure in `node scripts/build-shapes.cjs`, or `npm ci` failing.',
              '',
              'Without this alert the failure is silent until the feed-reliability',
              'audit later reports static-trip-coverage cratering — days later.',
              '',
              '**Action:** open the linked run for the exact error, then rebuild manually',
              'once the root cause is resolved:',
              '',
              '```bash',
              'node scripts/build-shapes.cjs',
              'git add data/ && git commit -m "data: regenerate from latest Metro GTFS"',
              'git push origin HEAD:rebuild-gtfs-manual && gh pr create --base main',
              '```',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'gtfs-rebuild-failure',
            });
            if (existing.some(i => i.title === title)) {
              console.log('Issue already open — skipping duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title,
              body,
              labels: ['gtfs-rebuild-failure'],
            });
