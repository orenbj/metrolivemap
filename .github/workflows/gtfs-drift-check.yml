name: GTFS Static Data Drift Check

# Runs weekly and on any push that touches data/ files.
# Fetches the latest GTFS zip from Metro, extracts trips.txt and stops.txt,
# then diffs trip_ids and stop_ids against the committed data/trips.json and
# data/stops.json. Files a GitHub issue if drift exceeds 5%.
on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC
  push:
    paths:
      - 'data/trips.json'
      - 'data/stops.json'
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest Metro GTFS
        run: |
          curl -sSL -o gtfs_rail.zip \
            "https://gitlab.com/LACMTA/gtfs_rail/raw/master/gtfs_rail.zip"
          curl -sSL -o gtfs_bus.zip \
            "https://gitlab.com/LACMTA/gtfs_bus/raw/master/gtfs_bus.zip"

      - name: Extract and compare
        id: compare
        run: |
          python3 - <<'PYEOF'
          import zipfile, json, os, sys

          # Load committed trip_ids from trips.json
          with open('data/trips.json') as f:
              committed_trips = set(json.load(f).keys())

          # Load committed stop_ids from stops.json
          with open('data/stops.json') as f:
              stops_data = json.load(f)
              # stops.json is keyed by stop_id
              committed_stops = set(stops_data.keys())

          # trips.json only covers rail (801–807) + BRT (901/910/950).
          # The bus GTFS zip contains ~36k bus-only trips; without filtering,
          # every bus trip appears as a "new trip" and inflates the issue body.
          #
          # The static GTFS route_id is NOT a bare code: rail GTFS uses names
          # ("Metro A Line"), bus GTFS uses dash-suffixed ids ("910-13196").
          # Mirror build-shapes.cjs's routeCodeFromId() so target trips are
          # actually matched — a direct membership test would exclude every
          # tracked trip and report ~100% false drift.
          RAIL_NAME_MAP = {
              'Metro A Line': '801', 'Metro B Line': '802', 'Metro C Line': '803',
              'Metro E Line': '804', 'Metro D Line': '805', 'Metro K Line': '807',
              'Metro L Line': '806',
          }
          TARGET_ROUTES = {'801','802','803','804','805','806','807','901','910','950'}
          BUS_RAIL_CODES = {'901','910','950'}

          def route_code_from_id(route_id):
              route_id = (route_id or '').strip()
              if not route_id:
                  return None
              if route_id in RAIL_NAME_MAP:
                  return RAIL_NAME_MAP[route_id]
              if route_id in TARGET_ROUTES:
                  return route_id
              prefix = route_id.split('-')[0]
              return prefix if prefix in BUS_RAIL_CODES else None

          live_trips = set()
          live_stops = set()
          for zip_name in ('gtfs_rail.zip', 'gtfs_bus.zip'):
              with zipfile.ZipFile(zip_name) as z:
                  names = z.namelist()
                  if 'trips.txt' in names:
                      with z.open('trips.txt') as f:
                          header = f.readline().decode().strip().split(',')
                          tid_idx = header.index('trip_id')
                          rid_idx = header.index('route_id')
                          for line in f:
                              parts = line.decode().strip().split(',')
                              if len(parts) > max(tid_idx, rid_idx):
                                  if route_code_from_id(parts[rid_idx]) in TARGET_ROUTES:
                                      live_trips.add(parts[tid_idx].strip())
                  if 'stops.txt' in names:
                      with z.open('stops.txt') as f:
                          header = f.readline().decode().strip().split(',')
                          sid_idx = header.index('stop_id')
                          for line in f:
                              parts = line.decode().strip().split(',')
                              if len(parts) > sid_idx:
                                  live_stops.add(parts[sid_idx].strip())

          # Compute drift
          trips_only_committed = committed_trips - live_trips
          trips_only_live      = live_trips - committed_trips
          stops_only_committed = committed_stops - live_stops
          stops_only_live      = live_stops - committed_stops

          trip_drift = len(trips_only_committed) / max(len(committed_trips), 1)
          stop_drift = len(stops_only_committed) / max(len(committed_stops), 1)

          # Coverage drift = the "new" direction (live − committed): the fraction
          # of currently-scheduled trips/stops our committed file does NOT yet
          # have. trip_drift/stop_drift only measure staleness (committed − live),
          # so a new Metro schedule whose OLD trips still exist upstream keeps
          # trip_drift low while live vehicles run NEW trip_ids we can't resolve —
          # exactly the 2026-05-26 incident, where this check stayed green but
          # feed-reliability's static-trip-coverage later cratered below 70%.
          # Thresholding the new direction makes this the leading indicator for
          # that coverage check (#235). Meaningful only because new_trips is now
          # scoped to target routes (#365), not ~36k bus-only trips.
          new_trip_drift = len(trips_only_live) / max(len(live_trips), 1)
          new_stop_drift = len(stops_only_live) / max(len(live_stops), 1)

          print(f"Committed trips : {len(committed_trips)}")
          print(f"Live trips      : {len(live_trips)}")
          print(f"Stale trips     : {len(trips_only_committed)}  ({trip_drift:.1%} drift)")
          print(f"New trips       : {len(trips_only_live)}  ({new_trip_drift:.1%} coverage drift)")
          print(f"Committed stops : {len(committed_stops)}")
          print(f"Live stops      : {len(live_stops)}")
          print(f"Stale stops     : {len(stops_only_committed)}  ({stop_drift:.1%} drift)")
          print(f"New stops       : {len(stops_only_live)}  ({new_stop_drift:.1%} coverage drift)")

          threshold = 0.05   # 5%
          exceeded  = (trip_drift > threshold or stop_drift > threshold or
                       new_trip_drift > threshold or new_stop_drift > threshold)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"trip_drift={trip_drift:.3f}\n")
              out.write(f"stop_drift={stop_drift:.3f}\n")
              out.write(f"new_trip_drift={new_trip_drift:.3f}\n")
              out.write(f"new_stop_drift={new_stop_drift:.3f}\n")
              out.write(f"stale_trips={len(trips_only_committed)}\n")
              out.write(f"new_trips={len(trips_only_live)}\n")
              out.write(f"stale_stops={len(stops_only_committed)}\n")
              out.write(f"new_stops={len(stops_only_live)}\n")
              out.write(f"exceeded={str(exceeded).lower()}\n")

          if exceeded:
              sys.exit(1)
          PYEOF

      - name: File GitHub issue on drift
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '⚠️ GTFS static data drift detected — rebuild trips.json / stops.json';
            const body = [
              '## GTFS Drift Alert',
              '',
              'The weekly drift check found that `data/trips.json` or `data/stops.json` ',
              'are significantly out of sync with the latest Metro GTFS feed.',
              '',
              '| Metric | Value |',
              '|--------|-------|',
              `| Stale trip_ids | ${{ steps.compare.outputs.stale_trips }} |`,
              `| New trip_ids   | ${{ steps.compare.outputs.new_trips }} |`,
              `| Stale stop_ids | ${{ steps.compare.outputs.stale_stops }} |`,
              `| New stop_ids   | ${{ steps.compare.outputs.new_stops }} |`,
              `| Trip drift (stale)        | ${{ steps.compare.outputs.trip_drift }} |`,
              `| Stop drift (stale)        | ${{ steps.compare.outputs.stop_drift }} |`,
              `| Trip coverage drift (new) | ${{ steps.compare.outputs.new_trip_drift }} |`,
              `| Stop coverage drift (new) | ${{ steps.compare.outputs.new_stop_drift }} |`,
              '',
              '_Stale drift = committed entries gone from upstream. Coverage drift = ',
              'currently-scheduled entries missing from our committed file; this is the ',
              'leading indicator for the feed-reliability `static-trip-coverage` check._',
              '',
              '**Action:** Download the latest GTFS zip, re-run the build scripts to regenerate',
              '`data/trips.json`, `data/stops.json`, and `data/rail-shapes.json`, then commit.',
              '',
              'Until fixed, vehicles on new/changed routes will appear on the map **without ETAs**.',
            ].join('\n');

            // Avoid duplicate issues — check for an open one with the same title
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'gtfs-drift',
            });

            if (existing.some(i => i.title === title)) {
              console.log('Issue already open — skipping duplicate.');
              return;
            }

            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title,
              body,
              labels: ['gtfs-drift'],
            });
