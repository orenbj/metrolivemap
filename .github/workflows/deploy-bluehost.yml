name: Deploy to Bluehost (orenbj.com/livemap)

# Auto-publishes the static site to Bluehost shared hosting on every push to
# main, alongside the existing GitHub Pages deploy. Bluehost has no native Git
# integration, so we sync the runtime files over FTPS (FTP-over-TLS).
#
# ── ONE-TIME SETUP ───────────────────────────────────────────────────────────
# Add three repo secrets at:
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
#
#   BLUEHOST_FTP_SERVER     FTP hostname. In Bluehost: cPanel → Files → FTP
#                           Accounts → "Configure FTP Client" shows the server
#                           (often ftp.orenbj.com or the server IP). Plain
#                           hostname only — no ftp:// prefix, no path.
#   BLUEHOST_FTP_USERNAME   The FTP account username (Bluehost usually formats
#                           it as user@orenbj.com).
#   BLUEHOST_FTP_PASSWORD   That FTP account's password.
#
# The site lands in `server-dir` below (public_html/livemap/) → served at
# https://orenbj.com/livemap/. If your docroot or subfolder differs, edit
# server-dir and re-run.
#
# ── NOTES ────────────────────────────────────────────────────────────────────
# • FTPS (explicit, port 21) is the secure default Bluehost supports. If the
#   handshake fails (some Bluehost boxes have strict/legacy TLS), switch
#   `protocol: ftps` → `protocol: ftp` as a last resort (plaintext — the
#   password crosses the wire unencrypted on every deploy), or open a Bluehost
#   ticket to enable SSH and switch to an rsync-over-SSH action instead.
# • The action keeps a `.ftp-deploy-sync-state.json` on the server so each run
#   uploads only changed files (the first run uploads everything).
# • To preview what WOULD upload without touching the server, set
#   `dry-run: true` once, run via "Run workflow", then remove it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a manual deploy from the Actions tab

# Never let two deploys race; a newer push supersedes an in-flight deploy.
concurrency:
  group: deploy-bluehost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to Bluehost via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.BLUEHOST_FTP_SERVER }}
          username:  ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password:  ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          protocol:  ftps
          port:      21
          local-dir: ./
          server-dir: public_html/livemap/
          # Ship ONLY what the browser needs. Everything below is dev tooling,
          # CI config, docs, or GitHub-Pages-specific and must not reach the
          # web server. (Specifying `exclude` replaces the action's default, so
          # the .git / node_modules globs are repeated here.)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            scripts/**
            docs/**
            .claude/**
            .github/**
            **/*.md
            package.json
            package-lock.json
            vitest.config.js
            CNAME
            data/*.txt
            data/*.zip
            **/*.log
