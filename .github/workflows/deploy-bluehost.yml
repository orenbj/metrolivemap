name: Deploy to Bluehost (orenbj.com/livemap)

# Auto-publishes the static site to Bluehost shared hosting on every push to
# main, alongside the existing GitHub Pages deploy. Bluehost has no native Git
# integration, so we sync the runtime files over FTPS (FTP-over-TLS).
#
# ── ONE-TIME SETUP ───────────────────────────────────────────────────────────
# Add three repo secrets at:
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
#
#   BLUEHOST_FTP_SERVER     FTP hostname. In Bluehost: cPanel → Files → FTP
#                           Accounts → "Configure FTP Client" shows the server
#                           (often ftp.orenbj.com or the server IP). Plain
#                           hostname only — no ftp:// prefix, no path.
#   BLUEHOST_FTP_USERNAME   The FTP account username (Bluehost usually formats
#                           it as user@orenbj.com).
#   BLUEHOST_FTP_PASSWORD   That FTP account's password.
#
# SERVER PATH: the FTP account is created with its "Directory" set to
# `public_html/livemap` in Bluehost, which CHROOTS the account — once it logs
# in, that folder IS its root. So `server-dir` below is `./` (the account's
# root), NOT `public_html/livemap/`. Net result: files land in
# public_html/livemap/ → served at https://orenbj.com/livemap/.
# Least-privilege: this account can only ever touch the /livemap folder.
# (If you instead rooted the account at public_html, set server-dir: livemap/.)
#
# ── NOTES ────────────────────────────────────────────────────────────────────
# • FTPS (explicit, port 21) is the secure default Bluehost supports. If the
#   handshake fails (some Bluehost boxes have strict/legacy TLS), switch
#   `protocol: ftps` → `protocol: ftp` as a last resort (plaintext — the
#   password crosses the wire unencrypted on every deploy), or open a Bluehost
#   ticket to enable SSH and switch to an rsync-over-SSH action instead.
# • The action keeps a `.ftp-deploy-sync-state.json` on the server so each run
#   uploads only changed files (the first run uploads everything).
# • To preview what WOULD upload without touching the server, set
#   `dry-run: true` once, run via "Run workflow", then remove it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a manual deploy from the Actions tab

# Never let two deploys race; a newer push supersedes an in-flight deploy.
concurrency:
  group: deploy-bluehost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage ONLY the browser-facing files into a clean dir, then deploy that.
      # This is deterministic — we control exactly what ships — and avoids the
      # FTP-Deploy-Action `exclude` globs, which silently failed to filter
      # tests/, package.json, CNAME, etc. on the first run (they all landed on
      # the server). Runtime surface = index.html + 404.html + manifest.json +
      # the js/ styles/ data/ images/ dirs. Everything else (tests, scripts,
      # docs, .github, package.json, CNAME, *.md) stays out of public_html.
      - name: Stage runtime files
        run: |
          mkdir -p _site
          cp -r index.html 404.html manifest.json js styles data images _site/
          echo "Staged for deploy:" && ls -la _site/

      - name: Sync to Bluehost via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:    ${{ secrets.BLUEHOST_FTP_SERVER }}
          username:  ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password:  ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          protocol:  ftps
          port:      21
          # _site/ holds only runtime files, so no exclude globs are needed.
          local-dir: _site/
          # `./` = the FTP account's chroot root (its Directory is set to
          # public_html/livemap in Bluehost), so files land directly there.
          # The action diffs against its server-side state file and DELETES
          # files no longer present locally — so the stray dev files the first
          # (exclude-broken) run uploaded get cleaned up on this deploy.
          server-dir: ./
          # Re-state the default git excludes (overridden once `exclude` is set;
          # harmless here since _site has no .git anyway — kept for clarity).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
